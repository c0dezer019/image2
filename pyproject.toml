[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pico-ascii"
version = "0.1.0"
description = "Convert images to colored ASCII or traditional ANSI art."
requires-python = ">=3.14"
dependencies = ["Pillow"]

[project.scripts]
ascii = "ascii:main"

[tool.setuptools]
py-modules = ["ascii", "img2ansi", "img2ascii", "imgcommon"]

[tool.black]
line-length = 79
target-version = ['py314']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
)/
'''
