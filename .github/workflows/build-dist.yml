name: Build Distributions

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Linux (amd64 + arm64) ─────────────────────────────────────────────────
  build-linux:
    name: Build linux-${{ matrix.pkg_arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            pkg_arch: amd64
          - os: ubuntu-22.04-arm
            pkg_arch: arm64

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.14'

      - name: Install system deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libcairo2 libcairo2-dev \
            libpango1.0-dev \
            dpkg-dev

      - name: Install Python deps
        run: |
          pip install -r requirements.txt
          pip install pyinstaller pyinstaller-hooks-contrib
          pip install -e .

      - name: PyInstaller
        run: pyinstaller packaging/img2.spec

      - name: Package .deb
        run: bash packaging/make-deb.sh ${{ matrix.pkg_arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: img2-linux-${{ matrix.pkg_arch }}
          path: dist/img2*.deb
          if-no-files-found: error

  # ── Windows (x86_64) ──────────────────────────────────────────────────────
  build-windows:
    name: Build windows-x86_64
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.14'

      - name: Install Cairo DLLs via MSYS2
        shell: pwsh
        run: |
          C:\msys64\usr\bin\bash.exe -lc `
            "pacman -S --noconfirm mingw-w64-x86_64-cairo mingw-w64-x86_64-glib2 mingw-w64-x86_64-pixman mingw-w64-x86_64-libpng"
          "CAIRO_DLL_DIR=C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install Python deps
        run: |
          pip install -r requirements.txt
          pip install pyinstaller pyinstaller-hooks-contrib
          pip install -e .

      - name: PyInstaller
        shell: pwsh
        run: |
          $env:PATH = "$env:CAIRO_DLL_DIR;$env:PATH"
          pyinstaller packaging/img2.spec

      - name: Rename .exe
        shell: pwsh
        run: |
          $ver = python -c @"
          import tomllib, pathlib
          d = tomllib.load(pathlib.Path('pyproject.toml').open('rb'))
          print(d['project']['version'])
          "@
          Move-Item dist\img2.exe "dist\img2-$ver-windows-x86_64.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: img2-windows-x86_64
          path: dist/img2*.exe
          if-no-files-found: error

  # ── macOS (arm64) ─────────────────────────────────────────────────────────
  build-macos:
    name: Build macos-arm64
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.14'

      - name: Install system deps
        run: brew install cairo

      - name: Install Python deps
        run: |
          pip install -r requirements.txt
          pip install pyinstaller pyinstaller-hooks-contrib
          pip install -e .

      - name: PyInstaller
        run: pyinstaller packaging/img2.spec

      - name: Package .tar.gz
        run: |
          ver=$(python3 -c "import tomllib,pathlib; d=tomllib.load(pathlib.Path('pyproject.toml').open('rb')); print(d['project']['version'])")
          tar -czf "dist/img2-${ver}-macos-arm64.tar.gz" -C dist img2

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: img2-macos-arm64
          path: dist/img2*.tar.gz
          if-no-files-found: error

  # ── Release (tag pushes only) ─────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.deb
            artifacts/*.exe
            artifacts/*.tar.gz
          generate_release_notes: true
